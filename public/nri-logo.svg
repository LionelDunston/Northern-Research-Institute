<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-label="Northern Research Institute logo">
  <!-- Background -->
  <rect width="700" height="220" rx="0" fill="#0a2de0"/>
  <!-- Left circle -->
  <circle cx="105" cy="110" r="68" fill="none" stroke="white" stroke-width="7" />
  <!-- Right / larger circle -->
  <circle cx="198" cy="110" r="88" fill="none" stroke="white" stroke-width="7" />
  <!-- Compass icon above N -->
  <g transform="translate(62,68) scale(0.55)" fill="none" stroke="white" stroke-width="1.2">
    <circle cx="14" cy="14" r="11" stroke-width="0.9"/>
    <circle cx="14" cy="14" r="1.2" fill="white" stroke="none"/>
    <!-- 4-point star -->
    <path d="M14 2 L15.6 11 L14 13 L12.4 11 Z" fill="white" stroke="none"/>
    <path d="M14 26 L15.6 17 L14 15 L12.4 17 Z" fill="white" stroke="none" opacity="0.95"/>
    <path d="M2 14 L11 12.4 L13 14 L11 15.6 Z" fill="white" stroke="none" opacity="0.95"/>
    <path d="M26 14 L17 15.6 L15 14 L17 12.4 Z" fill="white" stroke="none" opacity="0.95"/>
    <!-- diagonal ticks -->
    <path d="M7 7 L11 11 M21 7 L17 11 M7 21 L11 17 M21 21 L17 17" stroke-width="0.7" opacity="0.9"/>
    <!-- N S E W tiny -->
    <text x="14" y="4.5" text-anchor="middle" font-size="4" fill="white" font-family="Arial,sans-serif" font-weight="700">N</text>
  </g>
  <!-- NRI text -->
  <text x="78" y="145" font-family="Inter, Arial Black, sans-serif" font-size="92" font-weight="900" fill="white" letter-spacing="-2">NRI</text>
  <!-- NORTHERN -->
  <text x="313" y="88" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="900" fill="white" letter-spacing="0.5">NORTHERN</text>
  <!-- RESEARCH INSTITUTE -->
  <text x="313" y="128" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="white" letter-spacing="0.5">RESEARCH INSTITUTE</text>
  <!-- Tagline -->
  <text x="315" y="160" font-family="Georgia, serif" font-size="13.5" font-weight="400" fill="white" letter-spacing="3.2">KNOWLEDGE.</text>
  <text x="445" y="160" font-family="Georgia, serif" font-size="13.5" font-weight="400" fill="white" letter-spacing="3.2">INNOVATION.</text>
  <text x="578" y="160" font-family="Georgia, serif" font-size="13.5" font-weight="400" fill="white" letter-spacing="3.2">IMPACT.</text>
</svg>
